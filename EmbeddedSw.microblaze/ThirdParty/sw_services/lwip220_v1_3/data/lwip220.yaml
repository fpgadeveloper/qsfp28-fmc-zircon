%YAML 1.2
---
title: Bindings for lwip library

maintainers:
  - Vineeth Karumanchi <vineeth.karumanchi@amd.com>
  - Srinivas Neeli <srinivas.neeli@amd.com>

type: library

version: 1.0

description: |-
  lwip220 library lwIP (light weight IP) is an open source TCP/IP stack configured for AMD hard and soft Ethernet MACs.

properties:
  reg:
    description: Physical base address and size of the controller register map
  interrupts:
    description: Interrupt property of the controller
  xlnx,txcsum:
    description: Ethernet controller transmit checksum mode (Full, Partial and None)
  xlnx,rxcsum:
    description: Ethernet controller receive checksum mode (Full, Partial and None)
  axistream-connected:
    description: Connected Stream IP Type (1-AXI_FIFO 2-AXI_DMA 3-AXI_MCDMA)
  phy-handle:
    description: Child phy-node phandle property

supported_processors:
  - psx_cortexa78
  - cortexa78
  - psx_cortexr52
  - cortexr52
  - psu_cortexa53
  - psu_cortexr5
  - psv_cortexa72
  - psv_cortexr5
  - ps7_cortexa9
  - microblaze
  - microblaze_riscv

supported_os:
  - standalone
  - freertos10_xilinx

# ---- Opsero qsfp28-fmc-zircon (MicroBlaze targets only) --------------------
# The stock file declares
#
#     depends:
#         emacps:     [reg, interrupts]
#         axiethernet:[reg, interrupts, xlnx,txcsum, xlnx,rxcsum,
#                      axistream-connected]
#         emaclite:   [reg, interrupts]
#
# which lopper's baremetal_validate_comp_xlnx assist turns into a hard
# precondition: adding lwip220 to a domain fails with
#
#     ERROR: lwip220 requires at least one ethernet hardware instance to be
#     present
#
# unless the design contains an emacps, axiethernet or emaclite instance.
#
# This project's MAC is the 100G CMAC behind zircon_nic -- block-design module
# references with the application's own lwIP netif on the zircon raw path
# (Vitis/common/src/zircon_netif.c), not any of those three Xilinx IPs -- so
# the precondition is simply wrong here. On the Versal target it passes only
# because the PS GEM exists in the hardware (unused by this design); on the
# pure-PL MicroBlaze target (kcu116) there is no Xilinx MAC at all and the
# library could not be added. (Overlay lifted from ethernet-fmc-taxi-eth.)
#
# Dropping "depends" only removes that validation: the BSP still decides what
# to build from the hardware, because lwip220's CMakeLists.txt derives
# CONFIG_EMACPS / CONFIG_AXIETHERNET / CONFIG_EMACLITE from the driver
# instances found in the SDT (list(LENGTH ...) -> 0 when there are none), so
# no netif port source is compiled that would not have been compiled anyway.
...
